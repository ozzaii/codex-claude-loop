name: test

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bash
        run: bash test/smoke.sh < /dev/null
      - name: zsh
        run: |
          command -v zsh >/dev/null || sudo apt-get install -y zsh
          zsh test/smoke.sh < /dev/null
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck || brew install shellcheck
          shellcheck -S error plugin/skills/codex-loop/lib/codex-loop.sh test/smoke.sh
      - name: manifests are valid json
        run: |
          for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/skills/codex-loop/schemas/verdict.schema.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done
